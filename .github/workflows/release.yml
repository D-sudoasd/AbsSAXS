name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,gui,bl19b2,hdf5]
      - name: Verify tag and release metadata
        run: python scripts/validate_release_metadata.py --tag "$GITHUB_REF_NAME"
      - name: Ruff
        run: ruff check SASAbs.py saxs_mpl_style.py src tests paper/*.py scripts/*.py
      - name: Pytest
        run: pytest -q --tb=short

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Clean-install wheel and run smoke checks
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --upgrade pip
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          .release-smoke/bin/python -m pip install "${wheel}[gui,bl19b2,hdf5]"
          smoke_dir="$(mktemp -d)"
          cp examples/minimal_2d/run_minimal_2d_pipeline.py "$smoke_dir/"
          cp examples/minimal_2d/synthetic_detector_image.csv "$smoke_dir/"
          cp examples/minimal_2d/synthetic_geometry.json "$smoke_dir/"
          smoke_python="$PWD/.release-smoke/bin/python"
          smoke_cli="$PWD/.release-smoke/bin/saxsabs"
          (
          cd "$smoke_dir"
          "$smoke_cli" --version
          "$smoke_python" - <<'PY'
          from pathlib import Path

          import SASAbs
          import saxs_mpl_style
          import saxsabs

          presets = saxs_mpl_style.preset_choices()
          if len(presets) != 5:
              raise SystemExit(
                  f"expected five Workbench plot presets, got {presets!r}"
              )
          if SASAbs.saxs_mpl_style is not saxs_mpl_style:
              raise SystemExit(
                  "Workbench did not load the packaged plot-style module"
              )
          for module in (SASAbs, saxs_mpl_style, saxsabs):
              module_path = Path(module.__file__).resolve()
              if "site-packages" not in module_path.parts:
                  raise SystemExit(
                      f"expected installed wheel module, got {module_path}"
                  )
          PY
          "$smoke_python" run_minimal_2d_pipeline.py --output-dir outputs
          )
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Build release notes header from project metadata
        run: python scripts/build_release_notes.py --output release-body.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-body.md
          generate_release_notes: true
