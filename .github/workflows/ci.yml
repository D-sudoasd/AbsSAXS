name: ci

on:
  push:
    branches: [main, joss-submission]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      lint: ${{ steps.plan.outputs.lint }}
      matrix: ${{ steps.plan.outputs.matrix }}
      paper: ${{ steps.plan.outputs.paper }}
      package: ${{ steps.plan.outputs.package }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Select checks from a validated baseline
        id: plan
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed, missing or still-running baseline is not reusable evidence.
          # This also prevents a later docs-only push from hiding an earlier failure.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            python scripts/select_checks.py --full --github-output "$GITHUB_OUTPUT"
          else
            validated="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch "$BASE_BRANCH" --commit "$BASE" --status success --limit 1 \
              --json headSha --jq 'length' 2>/dev/null || echo 0)"
            if [ "$validated" != 1 ]; then
              python scripts/select_checks.py --full --github-output "$GITHUB_OUTPUT"
            elif git fetch --no-tags --depth=1 origin "$BASE"; then
              python scripts/select_checks.py --base "$BASE" --head HEAD --github-output "$GITHUB_OUTPUT"
            else
              python scripts/select_checks.py --full --github-output "$GITHUB_OUTPUT"
            fi
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.lint != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install 'ruff>=0.5'
      - name: Ruff
        env:
          LINT_PATHS: ${{ needs.changes.outputs.lint }}
        run: >-
          python -c "import json, os, subprocess, sys;
          sys.exit(subprocess.call([sys.executable, '-m', 'ruff', 'check',
          *json.loads(os.environ['LINT_PATHS'])]))"

  test:
    needs: changes
    if: needs.changes.outputs.tests != '[]'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,gui,bl19b2,hdf5]
      - name: Pytest
        env:
          TEST_PATHS: ${{ needs.changes.outputs.tests }}
        run: >-
          python -c "import json, os, subprocess, sys;
          sys.exit(subprocess.call([sys.executable, '-m', 'pytest', '-q', '--tb=short',
          *json.loads(os.environ['TEST_PATHS'])]))"

  paper:
    needs: changes
    if: needs.changes.outputs.paper == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build paper PDF
        run: |
          docker run --rm \
            -e JOURNAL=joss \
            -v "$PWD:/data" \
            -u "$(id -u):$(id -g)" \
            openjournals/inara:latest \
            -o pdf \
            paper/paper.md
      - uses: actions/upload-artifact@v7
        with:
          name: paper-pdf
          path: paper/paper.pdf
          if-no-files-found: error

  package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build --sdist --wheel --outdir dist
          python -m twine check dist/*
      - name: Clean-install wheel and check the installed CLI
        run: |
          python -m venv "$RUNNER_TEMP/saxsabs-wheel-smoke"
          smoke_python="$RUNNER_TEMP/saxsabs-wheel-smoke/bin/python"
          smoke_cli="$RUNNER_TEMP/saxsabs-wheel-smoke/bin/saxsabs"
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          "$smoke_python" -m pip install "${wheel}[gui,bl19b2,hdf5]"
          smoke_dir="$(mktemp -d)"
          (
            cd "$smoke_dir"
            "$smoke_cli" --version
            "$smoke_python" - <<'PY'
          from pathlib import Path

          import saxsabs

          module_path = Path(saxsabs.__file__).resolve()
          if "site-packages" not in module_path.parts:
              raise SystemExit(f"expected installed wheel, got {module_path}")
          print(f"installed_version={saxsabs.__version__}")
          print(f"installed_module={module_path}")
          PY
          )
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
