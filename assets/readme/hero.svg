<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">saxsabs absolute-intensity calibration for SAXS</title>
  <desc id="desc">saxsabs estimates the calibration factor K from a measured SAXS profile and a reference, then writes absolute I(q) in inverse centimetres together with intensity state and physical inputs.</desc>
  <rect width="1200" height="360" rx="22" fill="#071218"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <g transform="translate(56 46)">
      <text x="0" y="0" fill="#86A0B2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" letter-spacing="1.8">SMALL-ANGLE X-RAY SCATTERING</text>
      <text x="0" y="70" fill="#F5F7F8" font-size="52" font-weight="700">saxsabs</text>
      <text x="0" y="122" fill="#B9C6CF" font-size="20">Estimate K from NIST SRM 3600, water,</text>
      <text x="0" y="150" fill="#B9C6CF" font-size="20">or a user reference, then write I(q) in</text>
      <text x="0" y="178" fill="#B9C6CF" font-size="20">cm⁻¹ with the calibration inputs.</text>
      <path d="M0 220H500" stroke="#2A3A45"/>
      <text x="0" y="254" fill="#86A0B2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">CLI  ·  PYTHON API  ·  WORKBENCH</text>
    </g>

    <g transform="translate(640 40)">
      <path d="M0 0H500M0 280H500" stroke="#2A3A45"/>
      <text x="0" y="24" fill="#86A0B2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" letter-spacing="1.4">CALIBRATION PATH</text>

      <g transform="translate(0 48)">
        <path d="M0 128H500M0 12V128" stroke="#2A3A45" stroke-width="1.5"/>
        <path d="M10 28C52 34 88 44 124 58C162 76 200 88 242 98C284 106 326 112 366 116C410 120 452 122 490 124" fill="none" stroke="#D38A3B" stroke-width="4"/>
        <path d="M10 36C50 42 86 52 124 66C160 84 200 96 242 106C282 114 324 118 366 122C408 124 450 126 490 127" fill="none" stroke="#5CA7D1" stroke-width="3" stroke-dasharray="7 7"/>
        <circle cx="62" cy="48" r="4" fill="#5CA7D1"/>
        <circle cx="124" cy="66" r="4" fill="#5CA7D1"/>
        <circle cx="200" cy="96" r="4" fill="#5CA7D1"/>
        <circle cx="282" cy="112" r="4" fill="#5CA7D1"/>
        <circle cx="366" cy="118" r="4" fill="#5CA7D1"/>
        <circle cx="452" cy="122" r="4" fill="#5CA7D1"/>
        <text x="0" y="158" fill="#86A0B2" font-size="18">measured I(q)</text>
        <text x="352" y="158" fill="#86A0B2" font-size="18">reference I(q)</text>
      </g>

      <g transform="translate(0 236)">
        <circle cx="8" cy="4" r="5" fill="#5CA7D1"/>
        <text x="22" y="10" fill="#F5F7F8" font-size="20" font-weight="650">K</text>
        <path d="M56 4H108" stroke="#506473" stroke-width="2"/>
        <path d="M98 -3L109 4L98 11" fill="none" stroke="#506473" stroke-width="2"/>
        <text x="122" y="10" fill="#F5F7F8" font-size="20" font-weight="650">I(q) / cm⁻¹</text>
        <path d="M260 4H312" stroke="#506473" stroke-width="2"/>
        <path d="M302 -3L313 4L302 11" fill="none" stroke="#506473" stroke-width="2"/>
        <circle cx="332" cy="4" r="5" fill="#69B594"/>
        <text x="346" y="10" fill="#F5F7F8" font-size="20" font-weight="650">export</text>
      </g>
    </g>
  </g>
</svg>
