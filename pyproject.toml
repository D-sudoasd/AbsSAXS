[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saxsabs"
version = "2.0.0"
description = "Traceable SAXS absolute-intensity calibration and profile I/O"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Delun Gong", email = "dlgong@imr.ac.cn" }
]
keywords = ["SAXS", "absolute intensity", "calibration", "synchrotron", "scattering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "xraydb>=4.5",
]

[project.optional-dependencies]
gui = [
  "pyFAI>=2023.0",
  "fabio>=2023.0",
  "matplotlib>=3.7",
  "sv-ttk>=2.6",
]
io = ["fabio>=2023.0"]
hdf5 = ["h5py>=3.8"]
bl19b2 = [
  "fabio>=2023.0",
  "h5py>=3.8",
  "matplotlib>=3.7",
  "pyFAI>=2023.0",
  "tifffile>=2023.0",
]
dev = [
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "pytest>=8.0",
  "ruff>=0.5",
  "setuptools>=77",
  "tomli>=2.0; python_version < '3.11'",
  "wheel",
]

[project.scripts]
saxsabs = "saxsabs.cli:main"
saxsabs-workbench = "saxsabs.workbench_launcher:run_with_error_handling"

[project.urls]
Homepage = "https://github.com/D-sudoasd/AbsSAXS"
Repository = "https://github.com/D-sudoasd/AbsSAXS"
Issues = "https://github.com/D-sudoasd/AbsSAXS/issues"
Changelog = "https://github.com/D-sudoasd/AbsSAXS/blob/main/CHANGELOG.md"
"Concept DOI" = "https://doi.org/10.5281/zenodo.19687103"

[tool.setuptools]
package-dir = {"" = ".", "saxsabs" = "src/saxsabs"}
py-modules = ["SASAbs", "saxs_mpl_style"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep the project lint contract explicit so a user-level Ruff configuration
# cannot silently broaden CI to unrelated stylistic rules.
select = ["E4", "E7", "E9", "F"]
